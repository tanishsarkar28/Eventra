<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="danceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0c2e" />
      <stop offset="50%" stop-color="#2d124d" />
      <stop offset="100%" stop-color="#0f051d" />
    </linearGradient>
    <linearGradient id="purpleGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="lpuOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f15a24" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#danceBg)" />

  <!-- Stage Lights Radial Glow -->
  <circle cx="400" cy="0" r="300" fill="#a855f7" opacity="0.25" />
  <circle cx="150" cy="150" r="180" fill="#ec4899" opacity="0.2" />
  <circle cx="650" cy="150" r="180" fill="#f59e0b" opacity="0.18" />

  <!-- LPU Brand Header -->
  <rect x="50" y="38" width="95" height="26" rx="5" fill="url(#lpuOrange)" />
  <text x="97" y="55" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">LPU CULTURAL</text>
  <text x="160" y="55" fill="#d8b4fe" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600">ONE WORLD UNIVERSITY FEST 2026</text>

  <!-- Title -->
  <text x="50" y="130" fill="#f472b6" font-family="-apple-system, Segoe UI, sans-serif" font-size="15" font-weight="800" letter-spacing="2">ANNUAL CAMPUS DANCE EXTRAVAGANZA</text>
  <text x="50" y="190" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">INTER-COLLEGE</text>
  <text x="50" y="240" fill="url(#purpleGold)" font-family="-apple-system, Segoe UI, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">DANCE NIGHT &amp; GALA</text>

  <text x="50" y="285" fill="#e9d5ff" font-family="-apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">
    Classical, Western, Hip-Hop &amp; Folk Group Face-Offs featuring Live Celebrity Judges
  </text>

  <!-- Divider -->
  <line x1="50" y1="315" x2="750" y2="315" stroke="#4c1d95" stroke-width="1.5" />

  <!-- Details Row -->
  <g transform="translate(50, 345)">
    <rect x="0" y="0" width="170" height="55" rx="8" fill="#2e1065" stroke="#581c87" stroke-width="1" />
    <text x="15" y="24" fill="#c084fc" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600">DATE &amp; TIME</text>
    <text x="15" y="44" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700">Dec 05 • 06:00 PM</text>

    <rect x="185" y="0" width="260" height="55" rx="8" fill="#2e1065" stroke="#581c87" stroke-width="1" />
    <text x="200" y="24" fill="#c084fc" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600">VENUE</text>
    <text x="200" y="44" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700">Shanti Devi Mittal Audi (SDM)</text>

    <rect x="460" y="0" width="120" height="55" rx="8" fill="#2e1065" stroke="#581c87" stroke-width="1" />
    <text x="475" y="24" fill="#f472b6" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700">TICKET</text>
    <text x="475" y="44" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="800">₹150</text>

    <rect x="595" y="0" width="105" height="55" rx="8" fill="#ec4899" />
    <text x="647" y="24" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PASS</text>
    <text x="647" y="44" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="900" text-anchor="middle">AVAILABLE</text>
  </g>
</svg>
