<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="gameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111c30" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="gamingFlame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f15a24" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#gameBg)" />

  <!-- Diagonal gaming stripes -->
  <path d="M-50,450 L350,-50 L400,-50 L0,450 Z" fill="#ef4444" opacity="0.08" />
  <path d="M450,450 L850,-50 L900,-50 L500,450 Z" fill="#f59e0b" opacity="0.06" />

  <!-- Glowing gaming orb -->
  <circle cx="700" cy="180" r="160" fill="#f15a24" opacity="0.15" />
  <circle cx="100" cy="100" r="120" fill="#10b981" opacity="0.12" />

  <!-- LPU Brand Header -->
  <rect x="50" y="38" width="95" height="26" rx="5" fill="url(#gamingFlame)" />
  <text x="97" y="55" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">LPU ESPORTS</text>
  <text x="160" y="55" fill="#93c5fd" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600">CAMPUS TOURNAMENT LEAGUE</text>

  <!-- Title -->
  <text x="50" y="130" fill="#10b981" font-family="-apple-system, Segoe UI, sans-serif" font-size="15" font-weight="800" letter-spacing="2">LAN ARENA CHAMPIONSHIP 2026</text>
  <text x="50" y="190" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">VALORANT &amp; BGMI</text>
  <text x="50" y="240" fill="url(#gamingFlame)" font-family="-apple-system, Segoe UI, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">CAMPUS SHOWDOWN</text>

  <text x="50" y="285" fill="#94a3b8" font-family="-apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">
    High-Octane 5v5 &amp; Squad Battles on 240Hz Gaming Rigs with Live Shoutcasting
  </text>

  <!-- Divider -->
  <line x1="50" y1="315" x2="750" y2="315" stroke="#1e293b" stroke-width="1.5" />

  <!-- Details Row -->
  <g transform="translate(50, 345)">
    <rect x="0" y="0" width="170" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="15" y="24" fill="#94a3b8" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600">DATE &amp; TIME</text>
    <text x="15" y="44" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700">Dec 08 • 11:00 AM</text>

    <rect x="185" y="0" width="260" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="200" y="24" fill="#94a3b8" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600">CAMPUS VENUE</text>
    <text x="200" y="44" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700">Baldev Raj Mittal Unipolis</text>

    <rect x="460" y="0" width="120" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="475" y="24" fill="#f59e0b" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700">CASH PRIZE</text>
    <text x="475" y="44" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="800">₹75,000</text>

    <rect x="595" y="0" width="105" height="55" rx="8" fill="#10b981" />
    <text x="647" y="24" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STATUS</text>
    <text x="647" y="44" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="900" text-anchor="middle">SLOTS OPEN</text>
  </g>
</svg>
